<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Duoshot</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; font: 14px system-ui, -apple-system, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    h1 { color: #67e8f9; font-size: 18px; margin: 0; }
    .hint { color: #94a3b8; font-size: 12px; margin: 0 0 12px; }
    .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .toggle button { padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .toggle button.active { background: rgba(6,182,212,.2); border: 1px solid #67e8f9; color: #cffafe; }
    .toggle button:not(.active) { background: #0f172a; border: 1px solid #334155; color: #94a3b8; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .slot { border: 1px solid #334155; background: rgba(15,23,42,.6); border-radius: 8px; padding: 8px; }
    .slot-header { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; margin-bottom: 4px; }
    .slot-header .clear { color: #f87171; cursor: pointer; background: none; border: none; font-size: 10px; padding: 0; }
    .drop { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 192px; border: 1px dashed #475569; background: rgba(2,6,23,.6); border-radius: 6px; color: #94a3b8; font-size: 12px; cursor: pointer; }
    .drop .icon { font-size: 24px; }
    .slot img { display: block; margin: 0 auto; height: 192px; width: auto; object-fit: contain; border-radius: 4px; }
    .slot .replace { text-align: center; font-size: 10px; color: #64748b; margin-top: 4px; }
    input[type=file] { display: none; }
    button.primary { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; background: #06b6d4; color: #0f172a; border: none; cursor: pointer; }
    button.primary:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
    button.primary:not(:disabled):hover { background: #22d3ee; }
    button.save { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; background: #d946ef; color: #0f172a; border: none; cursor: pointer; margin-top: 8px; }
    .preview { margin-top: 16px; padding: 8px; border: 1px solid #334155; background: #000; border-radius: 8px; }
    .preview img { display: block; margin: 0 auto; max-height: 60vh; width: auto; }
    canvas.hidden { display: none; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #06b6d4; color: #0f172a; padding: 10px 16px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Duoshot</h1>
    <span style="font-size: 11px; color: #64748b;">House of Sneijder</span>
  </header>
  <p class="hint">
    Twee foto's samen op één afbeelding (bv. voor- en achterkant). Kies of maak eerst A, dan B, dan combineer.
  </p>

  <div class="toggle">
    <button id="btnSide" class="active" type="button">Naast elkaar</button>
    <button id="btnStack" type="button">Boven elkaar</button>
  </div>

  <div class="slots">
    <div class="slot">
      <div class="slot-header"><span>A · voorkant</span><button class="clear" id="clearA" style="display:none">× wis</button></div>
      <label id="dropA" class="drop">
        <span class="icon">📷</span>
        <span style="margin-top:4px">Neem foto of upload</span>
        <input type="file" id="fileA" accept="image/*" capture="environment" />
      </label>
      <label id="picA" style="display:none; cursor:pointer;">
        <img id="imgA" alt="A" />
        <div class="replace">tap = vervang</div>
        <input type="file" id="fileA2" accept="image/*" capture="environment" />
      </label>
    </div>
    <div class="slot">
      <div class="slot-header"><span>B · achterkant</span><button class="clear" id="clearB" style="display:none">× wis</button></div>
      <label id="dropB" class="drop">
        <span class="icon">📷</span>
        <span style="margin-top:4px">Neem foto of upload</span>
        <input type="file" id="fileB" accept="image/*" capture="environment" />
      </label>
      <label id="picB" style="display:none; cursor:pointer;">
        <img id="imgB" alt="B" />
        <div class="replace">tap = vervang</div>
        <input type="file" id="fileB2" accept="image/*" capture="environment" />
      </label>
    </div>
  </div>

  <button id="btnMerge" class="primary" disabled type="button">Combineer tot 1 foto</button>

  <div id="previewBox" class="preview" style="display:none">
    <img id="mergedImg" alt="samengevoegd" />
    <button id="btnSave" class="save" type="button">📥 Sla op in galerij</button>
  </div>

  <canvas id="cv" class="hidden"></canvas>
  <div id="toast" class="toast"></div>

  <script>
    const MAX_SIDE = 1600;
    const GAP = 24;
    const BG = "#0f172a";
    const state = { a: null, b: null, layout: "sideBySide", merged: null };
    const $ = (id) => document.getElementById(id);

    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function loadPhoto(file, slot) {
      const rawUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        c.toBlob((blob) => {
          URL.revokeObjectURL(rawUrl);
          if (!blob) return;
          const u = URL.createObjectURL(blob);
          if (state[slot]) URL.revokeObjectURL(state[slot].url);
          state[slot] = { url: u, w, h };
          state.merged = null;
          render();
        }, "image/jpeg", 0.92);
      };
      img.src = rawUrl;
    }

    function render() {
      // Slot A
      if (state.a) {
        $("dropA").style.display = "none";
        $("picA").style.display = "block";
        $("imgA").src = state.a.url;
        $("clearA").style.display = "inline";
      } else {
        $("dropA").style.display = "flex";
        $("picA").style.display = "none";
        $("clearA").style.display = "none";
      }
      // Slot B
      if (state.b) {
        $("dropB").style.display = "none";
        $("picB").style.display = "block";
        $("imgB").src = state.b.url;
        $("clearB").style.display = "inline";
      } else {
        $("dropB").style.display = "flex";
        $("picB").style.display = "none";
        $("clearB").style.display = "none";
      }
      // Merge button
      $("btnMerge").disabled = !(state.a && state.b);
      // Preview
      if (state.merged) {
        $("previewBox").style.display = "block";
        $("mergedImg").src = state.merged;
      } else {
        $("previewBox").style.display = "none";
      }
      // Layout toggle
      $("btnSide").classList.toggle("active", state.layout === "sideBySide");
      $("btnStack").classList.toggle("active", state.layout === "stacked");
    }

    function clearSlot(slot) {
      if (state[slot]) URL.revokeObjectURL(state[slot].url);
      state[slot] = null;
      state.merged = null;
      render();
    }

    function drawImg(ctx, url, x, y, w, h, done) {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, x, y, w, h); done(); };
      img.src = url;
    }

    function mergeNow() {
      const a = state.a, b = state.b;
      if (!a || !b) return;
      const c = $("cv");
      const ctx = c.getContext("2d");
      if (state.layout === "sideBySide") {
        const H = Math.min(a.h, b.h);
        const aW = Math.round((a.w * H) / a.h);
        const bW = Math.round((b.w * H) / b.h);
        c.width = aW + bW + GAP;
        c.height = H;
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, c.width, c.height);
        drawImg(ctx, a.url, 0, 0, aW, H, () => {
          drawImg(ctx, b.url, aW + GAP, 0, bW, H, exportJpeg);
        });
      } else {
        const W = Math.min(a.w, b.w);
        const aH = Math.round((a.h * W) / a.w);
        const bH = Math.round((b.h * W) / b.w);
        c.width = W;
        c.height = aH + bH + GAP;
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, c.width, c.height);
        drawImg(ctx, a.url, 0, 0, W, aH, () => {
          drawImg(ctx, b.url, 0, aH + GAP, W, bH, exportJpeg);
        });
      }
    }

    function exportJpeg() {
      const c = $("cv");
      c.toBlob((blob) => {
        if (!blob) return;
        if (state.merged) URL.revokeObjectURL(state.merged);
        state.merged = URL.createObjectURL(blob);
        render();
      }, "image/jpeg", 0.92);
    }

    async function saveToGallery() {
      if (!state.merged) return;
      // In native WebView: geef Bytes door aan Android via bridge (window.DuoshotBridge)
      // Buiten native: gewoon download via <a>
      const resp = await fetch(state.merged);
      const blob = await resp.blob();
      if (window.DuoshotBridge && window.DuoshotBridge.saveJpeg) {
        const arr = new Uint8Array(await blob.arrayBuffer());
        let bin = "";
        for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
        const b64 = btoa(bin);
        const ts = new Date().toISOString().replace(/[:T]/g, "-").replace(/\..*/, "");
        const ok = window.DuoshotBridge.saveJpeg(b64, "duoshot-" + ts + ".jpg");
        showToast(ok ? "Opgeslagen in galerij ✓" : "Opslaan mislukt");
      } else {
        const a = document.createElement("a");
        a.href = state.merged;
        const ts = new Date().toISOString().replace(/[:T]/g, "-").replace(/\..*/, "");
        a.download = "duoshot-" + ts + ".jpg";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    // Wire up
    ["fileA","fileA2"].forEach(id => $(id).addEventListener("change", e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      loadPhoto(f, "a"); e.target.value = "";
    }));
    ["fileB","fileB2"].forEach(id => $(id).addEventListener("change", e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      loadPhoto(f, "b"); e.target.value = "";
    }));
    $("clearA").addEventListener("click", (e) => { e.preventDefault(); clearSlot("a"); });
    $("clearB").addEventListener("click", (e) => { e.preventDefault(); clearSlot("b"); });
    $("btnSide").addEventListener("click", () => { state.layout = "sideBySide"; state.merged = null; render(); });
    $("btnStack").addEventListener("click", () => { state.layout = "stacked"; state.merged = null; render(); });
    $("btnMerge").addEventListener("click", mergeNow);
    $("btnSave").addEventListener("click", saveToGallery);
    render();
  </script>
</body>
</html>
